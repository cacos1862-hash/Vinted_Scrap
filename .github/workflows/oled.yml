name: oled-errori
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oled
  cancel-in-progress: false
jobs:
  caccia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python oled_errori.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salva storico prezzi
        if: always()
        run: |
          git config user.name "hunter-bot"
          git config user.email "hunter-bot@users.noreply.github.com"
          git add oled_state.json || true
          git commit -m "stato oled" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
