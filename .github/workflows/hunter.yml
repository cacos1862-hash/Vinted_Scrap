name: vinted-hunter
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vinted
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python vinted_design_hunter.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salva memoria annunci
        if: always()
        run: |
          git config user.name "hunter-bot"
          git config user.email "hunter-bot@users.noreply.github.com"
          git add vinted_state.json || true
          git commit -m "stato" || exit 0
          git pull --rebase && git push
